# nginx reverse-proxy for Rezoom — a NEW server block alongside your other apps
# (does not touch them). Copy to /etc/nginx/sites-available/rezoom, symlink into
# sites-enabled, test, reload, then run certbot for HTTPS.
#
#   sudo ln -s /etc/nginx/sites-available/rezoom /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rezoom.praritsidana.com

server {
    listen 80;
    server_name rezoom.praritsidana.com;

    # Resume uploads are capped at 5 MB in the app; allow a little headroom.
    client_max_body_size 6M;

    location / {
        proxy_pass http://127.0.0.1:8011;        # must match GUNICORN_BIND in rezoom.service
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # lets Django know it's HTTPS
        proxy_read_timeout 120s;                       # AI + PDF render can be slow
    }
}
