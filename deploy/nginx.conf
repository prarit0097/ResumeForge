# nginx reverse-proxy for ResumeForge — one more server block alongside your
# other apps. Copy to /etc/nginx/sites-available/resumeforge, edit the domain and
# upstream port, symlink into sites-enabled, test, reload. Then run certbot.
#
#   sudo ln -s /etc/nginx/sites-available/resumeforge /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d resume.yourdomain.com

server {
    listen 80;
    server_name resume.yourdomain.com;   # <-- your domain/subdomain

    # Resume uploads are capped at 5 MB in the app; allow a little headroom.
    client_max_body_size 6M;

    location / {
        proxy_pass http://127.0.0.1:8001;        # <-- must match GUNICORN_BIND
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # lets Django know it's HTTPS
        proxy_read_timeout 120s;                       # AI + PDF render can be slow
    }
}
