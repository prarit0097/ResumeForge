{# Live ATS + JD-match score panel. Populated by refreshScore() (Phase 5). #}
<section class="mt-6 rounded-xl border border-slate-200 bg-white p-4">
  <div class="flex items-center justify-between">
    <h3 class="font-semibold">Resume health</h3>
    <button type="button" @click="refreshScore()" class="text-sm text-brand hover:underline">Re-check</button>
  </div>

  <template x-if="!score">
    <p class="text-sm text-slate-400 mt-2">Start filling in your resume to see your live ATS score.</p>
  </template>

  <template x-if="score">
    <div class="mt-3 space-y-3">
      <div class="flex items-center gap-4">
        <div class="text-3xl font-bold" :class="score.score >= 80 ? 'text-emerald-600' : score.score >= 60 ? 'text-amber-500' : 'text-red-500'"
             x-text="score.score"></div>
        <div>
          <p class="text-sm font-medium">ATS compatibility</p>
          <p class="text-xs text-slate-500" x-text="score.summary"></p>
        </div>
      </div>
      <template x-if="match">
        <div class="border-t border-slate-100 pt-3">
          <div class="flex items-center gap-4">
            <div class="text-3xl font-bold" :class="match.score >= 75 ? 'text-emerald-600' : 'text-amber-500'" x-text="match.score"></div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium">Job match</p>
              <p class="text-xs text-slate-500 truncate" x-show="match.missing && match.missing.length"
                 x-text="'Missing: ' + (match.missing||[]).slice(0,6).join(', ')"></p>
            </div>
            <button type="button" @click="tailorToJob()" :disabled="aiBusy"
                    class="rf-ai-btn shrink-0">✨ Tailor to job</button>
          </div>
          <template x-if="match.warnings && match.warnings.length">
            <p class="mt-2 text-xs text-amber-600" x-text="match.warnings[0]"></p>
          </template>
        </div>
      </template>
      <ul class="space-y-1.5">
        <template x-for="dim in (score.dimensions||[])" :key="dim.key">
          <li class="text-xs flex items-start gap-2" x-show="dim.fix">
            <span :class="dim.status==='ok' ? 'text-emerald-500' : 'text-amber-500'" x-text="dim.status==='ok' ? '✓' : '!'" class="shrink-0 font-bold"></span>
            <span class="text-slate-600" x-text="dim.fix"></span>
          </li>
        </template>
      </ul>
    </div>
  </template>
</section>
