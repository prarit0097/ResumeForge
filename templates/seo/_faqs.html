{# Visible FAQ accordion (native <details>, no JS). Expects `faqs` = list of (q, a). #}
<section class="mx-auto max-w-3xl px-4 sm:px-6 py-12" aria-labelledby="faq-heading">
  <h2 id="faq-heading" class="font-display text-2xl sm:text-3xl font-semibold text-center">Frequently asked questions</h2>
  <div class="mt-6 divide-y divide-slate-200 rounded-2xl border border-slate-200 bg-white">
    {% for q, a in faqs %}
    <details class="group p-5">
      <summary class="flex cursor-pointer items-center justify-between font-medium text-ink list-none">
        <span>{{ q }}</span>
        <span class="ml-4 text-slate-400 transition group-open:rotate-45">+</span>
      </summary>
      <p class="mt-3 text-slate-600 text-sm leading-relaxed">{{ a }}</p>
    </details>
    {% endfor %}
  </div>
</section>
